  :root {
    --bg: #060606;
    --fg: #f3f1ec;
    --muted: rgba(243, 241, 236, 0.5);
    --hairline: rgba(243, 241, 236, 0.14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  body {
    color: var(--fg);
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  canvas#scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 38%, rgba(0,0,0,0.55) 78%, rgba(0,0,0,0.85) 100%);
    z-index: 5;
  }

  .grain {
    position: fixed;
    inset: -50px;
    pointer-events: none;
    z-index: 6;
    opacity: 0.05;
    mix-blend-mode: overlay;
    background-image:
      radial-gradient(circle, #fff 0.6px, transparent 0.6px);
    background-size: 3px 3px;
    animation: grain-shift 0.4s steps(4) infinite;
  }

  @keyframes grain-shift {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(-1.5px, 1px); }
    50%  { transform: translate(1px, -1.5px); }
    75%  { transform: translate(-1px, -1px); }
    100% { transform: translate(1.5px, 1.5px); }
  }

  .scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 7;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.035) 0px,
      rgba(255,255,255,0.035) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
  }

  .flicker {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 8;
    background: #fff;
    opacity: 0;
    animation: flicker 6s ease-in-out infinite;
  }

  @keyframes flicker {
    0%, 96%, 100% { opacity: 0; }
    97% { opacity: 0.02; }
    98% { opacity: 0; }
    98.5% { opacity: 0.015; }
  }

  .flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    background: #fff;
    opacity: 0;
  }

  .flash.pulse {
    animation: flash-pulse 0.38s ease-out;
  }

  @keyframes flash-pulse {
    0% { opacity: 0.85; }
    100% { opacity: 0; }
  }

  .hud {
    position: fixed;
    top: 1.4rem;
    left: 1.6rem;
    z-index: 10;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .hud .rec-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #c94b3f;
    box-shadow: 0 0 6px 1px rgba(201, 75, 63, 0.8);
    animation: rec-blink 1.6s ease-in-out infinite;
  }

  @keyframes rec-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  .index {
    position: fixed;
    top: 1.4rem;
    right: 1.6rem;
    z-index: 10;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .stage-btn {
    position: fixed;
    inset: 0;
    z-index: 15;
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    margin: 0;
    padding: 0;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    color: inherit;
    font: inherit;
  }

  .stage-btn:focus-visible {
    outline: none;
  }

  .stage-btn:focus-visible .quote-block {
    outline: 1px solid var(--hairline);
    outline-offset: 12px;
  }

  .quote-block {
    width: 100%;
    max-width: 900px;
    padding: 0 1.75rem;
    margin-bottom: 12vh;
    text-align: center;
  }

  .quote-text {
    font-family: "Bebas Neue", "Arial Narrow", "Helvetica Neue Condensed", sans-serif;
    font-weight: 400;
    font-size: clamp(1.9rem, 6.2vw, 3.6rem);
    line-height: 1.05;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    text-wrap: balance;
    margin: 0 0 1.1rem;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .quote-text.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .quote-author {
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.6s ease 0.1s;
  }

  .quote-author.visible {
    opacity: 1;
  }

  .quote-author::before {
    content: "\2014  ";
  }

  .quote-source {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    font-style: italic;
    color: var(--muted);
    opacity: 0;
    margin: 0.4rem 0 0;
    transition: opacity 0.6s ease 0.2s;
  }

  .quote-source.visible {
    opacity: 0.7;
  }

  .prompt {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.65rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 1.6rem;
    animation: pulse-op 2.6s ease-in-out infinite;
  }

  @keyframes pulse-op {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.9; }
  }

  .glitching .quote-text {
    animation: glitch-text 0.32s steps(2, end);
  }

  @keyframes glitch-text {
    0%   { transform: translate(0, 0); text-shadow: none; }
    15%  { transform: translate(-3px, 1px); text-shadow: 2px 0 #c94b3f, -2px 0 #3f8fc9; }
    30%  { transform: translate(2px, -1px); text-shadow: -2px 0 #c94b3f, 2px 0 #3f8fc9; }
    45%  { transform: translate(-2px, 0); text-shadow: 2px 0 #c94b3f, -2px 0 #3f8fc9; }
    60%  { transform: translate(1px, 1px); text-shadow: none; }
    100% { transform: translate(0, 0); text-shadow: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .grain, .flicker, .hud .rec-dot, .prompt { animation: none; }
    .quote-text, .quote-author, .quote-source { transition: none; }
    .glitching .quote-text { animation: none; }
  }
</style>
</head>
<body>

<canvas id="scene" aria-hidden="true"></canvas>
<div class="vignette"></div>
<div class="grain"></div>
<div class="scanlines"></div>
<div class="flicker"></div>
<div class="flash" id="flash"></div>

<div class="hud"><span class="rec-dot"></span><span id="timecode">00:00:00:00</span></div>
<div class="index" id="reelIndex">N&deg; 00 / 365</div>

<button class="stage-btn" id="stage" type="button" aria-label="Draw a quote">
  <div class="quote-block" id="quoteBlock">
    <p class="quote-text" id="quoteText">Press to draw a fortune</p>
    <p class="quote-author" id="quoteAuthor"></p>
    <p class="quote-source" id="quoteSource"></p>
  </div>
  <div class="prompt" id="prompt">Press anywhere to draw</div>
</button>

    { text: "It is not that we have a short time to live, but that we waste a lot of it.", author: "Seneca", cat: "wind", source: "On the Shortness of Life, c. 49 CE" },
    { text: "It's not what happens to you, but how you react to it that matters.", author: "Epictetus", cat: "stone", source: "The Enchiridion, c. 125 CE" },
    { text: "No man ever steps in the same river twice.", author: "Heraclitus", cat: "sea", source: "fragment, c. 500 BCE" },
    { text: "The wound is the place where the light enters you.", author: "Rumi", cat: "lightning", source: "The Masnavi, 13th century" },
    { text: "All of humanity's problems stem from man's inability to sit quietly in a room alone.", author: "Blaise Pascal", cat: "void", source: "Pensées, 1670" },
    { text: "The highest activity a human being can attain is learning for understanding, because to understand is to be free.", author: "Baruch Spinoza", cat: "void", source: "Ethics, 1677" },
    { text: "Life can only be understood backwards; but it must be lived forwards.", author: "Søren Kierkegaard", cat: "sea", source: "Journals, 1843" },
    { text: "Freedom is what you do with what's been done to you.", author: "Jean-Paul Sartre", cat: "wind" },
    { text: "Change your life today. Don't gamble on the future, act now, without delay.", author: "Simone de Beauvoir", cat: "fire" },
    { text: "In the midst of winter, I found there was, within me, an invincible summer.", author: "Albert Camus", cat: "fire", source: "Return to Tipasa, 1952" },
    { text: "In the midst of chaos, there is also opportunity.", author: "Sun Tzu", cat: "lightning", source: "The Art of War, c. 5th century BCE" },
    { text: "Everyone thinks of changing the world, but no one thinks of changing himself.", author: "Leo Tolstoy", cat: "stone" },
    { text: "To live without hope is to cease to live.", author: "Fyodor Dostoevsky", cat: "void" },
    { text: "Even the darkest night will end and the sun will rise.", author: "Victor Hugo", cat: "void", source: "Les Misérables, 1862" },
    { text: "It is not true that people stop pursuing dreams because they grow old; they grow old because they stop pursuing dreams.", author: "Gabriel García Márquez", cat: "sea" },
    { text: "If you want to fly, you have to give up the things that weigh you down.", author: "Toni Morrison", cat: "wind" },
    { text: "If you don't like someone's story, write your own.", author: "Chinua Achebe", cat: "fire" },
    { text: "Pain is inevitable. Suffering is optional.", author: "Haruki Murakami", cat: "rain", source: "What I Talk About When I Talk About Running, 2007" },
    { text: "You cannot find peace by avoiding life.", author: "Virginia Woolf", cat: "stone" },
    { text: "Paths are made by walking.", author: "Franz Kafka", cat: "wind", source: "The Zürau Aphorisms, 1917" },
    { text: "Nothing is built on stone; all is built on sand, but we must build as if the sand were stone.", author: "Jorge Luis Borges", cat: "stone" },
    { text: "In the end we all become stories.", author: "Isabel Allende", cat: "void" },
    { text: "We are what we repeatedly do. Excellence, then, is not an act, but a habit.", author: "Aristotle", cat: "stone" },
    { text: "You can't cross the sea merely by standing and staring at the water.", author: "Rabindranath Tagore", cat: "sea" },
    { text: "Any idiot can face a crisis; it's the day to day living that wears you out.", author: "Anton Chekhov", cat: "rain" },
    { text: "What we think, we become.", author: "Buddha", cat: "void", source: "Dhammapada, c. 3rd century BCE" },
    { text: "The present moment is filled with joy and happiness. If you are attentive, you will see it.", author: "Thich Nhat Hanh", cat: "sea", source: "Peace Is Every Step, 1991" },
    { text: "Happiness is not something ready-made. It comes from your own actions.", author: "Dalai Lama", cat: "fire", source: "The Art of Happiness, 1998" },
    { text: "Out of suffering have emerged the strongest souls.", author: "Kahlil Gibran", cat: "stone", source: "The Prophet, 1923" },
    { text: "Let nothing disturb you, let nothing frighten you; all things pass away, God never changes.", author: "Teresa of Ávila", cat: "void", source: "attributed prayer-poem, 16th century" },
    { text: "Even after all this time, the sun never says to the earth, 'You owe me.' Look what happens with a love like that. It lights the whole sky.", author: "Hafiz", cat: "fire", source: "The Gift, trans. Daniel Ladinsky, 1999" },
    { text: "Even kings and emperors with heaps of wealth and vast dominion cannot compare with an ant filled with the love of God.", author: "Guru Nanak", cat: "void", source: "Guru Granth Sahib" },
    { text: "The season of failure is the best time for sowing the seeds of success.", author: "Paramahansa Yogananda", cat: "stone" },
    { text: "Do your little bit of good where you are; it's those little bits of good put together that overwhelm the world.", author: "Desmond Tutu", cat: "sea" },
    { text: "I am not bound to win, but I am bound to be true.", author: "Abraham Lincoln", cat: "stone", source: "letter to Isham Reavis, 1855" },
    { text: "Faith is taking the first step even when you don't see the whole staircase.", author: "Martin Luther King Jr.", cat: "lightning" },
    { text: "Trust yourself. Create the kind of self that you will be happy to live with all your life.", author: "Golda Meir", cat: "void" },
    { text: "The power to question is the basis of all human progress.", author: "Indira Gandhi", cat: "lightning" },
    { text: "A people that loves freedom will in the end be free.", author: "Simón Bolívar", cat: "wind" },
    { text: "It is a sin not to do what one is capable of doing.", author: "José Martí", cat: "fire" },
    { text: "Do not weep for me. I know that my country, which is suffering so much, will know how to defend its independence and its liberty.", author: "Patrice Lumumba", cat: "rain", source: "last letter to Pauline Lumumba, January 1961" },
    { text: "At the stroke of the midnight hour, when the world sleeps, India will awake to life and freedom.", author: "Jawaharlal Nehru", cat: "lightning", source: "‘Tryst with Destiny’ speech, 14 August 1947" },
    { text: "It is not power that corrupts but fear.", author: "Aung San Suu Kyi", cat: "stone", source: "Freedom from Fear, 1991" },
    { text: "Freedom is not something that one people can bestow on another as a gift.", author: "Kwame Nkrumah", cat: "wind" },
    { text: "Hope is not the conviction that something will turn out well, but the certainty that something makes sense, regardless of how it turns out.", author: "Václav Havel", cat: "rain", source: "Disturbing the Peace, 1986" },
    { text: "It's the little things citizens do. That's what will make the difference. My little thing is planting trees.", author: "Wangari Maathai", cat: "sea", source: "Nobel Lecture, 2004" },
    { text: "Feet, what do I need you for when I have wings to fly?", author: "Frida Kahlo", cat: "wind", source: "diary, c. 1944–1954" },
    { text: "He who does not know how to look back at where he came from will never get to his destination.", author: "José Rizal", cat: "stone" },
    { text: "Truth is powerful and it prevails.", author: "Sojourner Truth", cat: "lightning" },
    { text: "If there is no struggle, there is no progress.", author: "Frederick Douglass", cat: "fire", source: "‘West India Emancipation’ speech, 1857" },
    { text: "The man dies in all who keep silent in the face of tyranny.", author: "Wole Soyinka", cat: "stone", source: "The Man Died: Prison Notes, 1972" },
    { text: "You must never be fearful about what you are doing when it is right.", author: "Rosa Parks", cat: "lightning" },
    { text: "He who cannot change the very fabric of his thought will never be able to change reality.", author: "Anwar Sadat", cat: "void", source: "In Search of Identity, 1978" },
    { text: "All life is Yoga.", author: "Sri Aurobindo", cat: "void", source: "The Synthesis of Yoga, 1914–1921" },
    { text: "Arise, awake, and stop not until the goal is reached.", author: "Swami Vivekananda", cat: "lightning" },
    { text: "There is nothing outside of yourself that can ever enable you to get better, stronger, richer, quicker, or smarter. Everything is within.", author: "Miyamoto Musashi", cat: "fire", source: "The Book of Five Rings, 1645" },
    { text: "The great man is he who does not lose his child's heart.", author: "Mencius", cat: "void", source: "Mencius, Book IV, c. 3rd century BCE" },
    { text: "The most potent weapon in the hands of the oppressor is the mind of the oppressed.", author: "Steve Biko", cat: "stone", source: "I Write What I Like, 1978" },
    { text: "Attention is the rarest and purest form of generosity.", author: "Simone Weil", cat: "void", source: "Gravity and Grace, 1947" },
    { text: "When the whole world is silent, even one voice becomes powerful.", author: "Malala Yousafzai", cat: "lightning", source: "UN Youth Assembly speech, 12 July 2013" },
    { text: "Where there's hope, there's life.", author: "Anne Frank", cat: "void", source: "The Diary of a Young Girl, 1947" },
    { text: "When we are no longer able to change a situation, we are challenged to change ourselves.", author: "Viktor Frankl", cat: "stone", source: "Man's Search for Meaning, 1946" },
    { text: "Who looks outside, dreams; who looks inside, awakes.", author: "Carl Jung", cat: "void" },
    { text: "Until death, it is all life.", author: "Miguel de Cervantes", cat: "fire", source: "Don Quixote, 1605" },
    { text: "Consider your origin; you were not made to live like brutes, but to follow virtue and knowledge.", author: "Dante Alighieri", cat: "stone", source: "Inferno, Canto XXVI, c. 1314" },
    { text: "Nothing is worth more than this day.", author: "Johann Wolfgang von Goethe", cat: "fire" },
    { text: "Life shrinks or expands in proportion to one's courage.", author: "Anaïs Nin", cat: "wind", source: "The Diary of Anaïs Nin" },
    { text: "I hope for nothing. I fear nothing. I am free.", author: "Nikos Kazantzakis", cat: "void", source: "epitaph, Heraklion, Crete, 1957" },
    { text: "The most difficult thing is the decision to act, the rest is merely tenacity.", author: "Amelia Earhart", cat: "wind" },
    { text: "A people without the knowledge of their past history, origin and culture is like a tree without roots.", author: "Marcus Garvey", cat: "stone", source: "Philosophy and Opinions of Marcus Garvey, 1923" },
    { text: "Inside us there is something that has no name, and that something is what we are.", author: "José Saramago", cat: "void", source: "Blindness, 1995" },

    { text: "Philosophers have hitherto only interpreted the world in various ways; the point is to change it.", author: "Karl Marx", cat: "stone", source: "Theses on Feuerbach, 1845" },
    { text: "Freedom is the recognition of necessity.", author: "Friedrich Engels", cat: "void", source: "Anti-Dühring, 1878" },
    { text: "There are decades where nothing happens; and there are weeks where decades happen.", author: "Vladimir Lenin", cat: "lightning" },
    { text: "You may not be interested in war, but war is interested in you.", author: "Leon Trotsky", cat: "stone" },
    { text: "Freedom is always and exclusively freedom for the one who thinks differently.", author: "Rosa Luxemburg", cat: "lightning", source: "The Russian Revolution, 1918" },
    { text: "Pessimism of the intellect, optimism of the will.", author: "Antonio Gramsci", cat: "fire", source: "Prison Notebooks, c. 1930" },
    { text: "We must risk the last and, if need be, the toughest, most dangerous stand.", author: "Clara Zetkin", cat: "lightning" },
    { text: "New life demands new forms.", author: "Alexandra Kollontai", cat: "wind" },
    { text: "Liberty and equality are not empty words.", author: "Louise Michel", cat: "stone" },
    { text: "The main enemy is at home.", author: "Karl Liebknecht", cat: "lightning", source: "speech, 1915" },
    { text: "There is no document of civilization which is not at the same time a document of barbarism.", author: "Walter Benjamin", cat: "stone", source: "Theses on the Philosophy of History, 1940" },
    { text: "The whole is the false.", author: "Theodor Adorno", cat: "void", source: "Minima Moralia, 1951" },
    { text: "Whoever does not wish to speak of capitalism should also remain silent about fascism.", author: "Max Horkheimer", cat: "stone", source: "essay, 1939" },
    { text: "The truth is that liberty can be made into a powerful instrument of domination.", author: "Herbert Marcuse", cat: "void", source: "One-Dimensional Man, 1964" },
    { text: "Thinking means venturing beyond.", author: "Ernst Bloch", cat: "lightning", source: "The Principle of Hope, 1954–1959" },
    { text: "Man has become estranged from his own labor.", author: "Georg Lukács", cat: "stone" },
    { text: "Love, work and knowledge are the wellsprings of our life. They should also govern it.", author: "Wilhelm Reich", cat: "void", source: "epitaph, Orgonon, Maine" },
    { text: "The public sphere is a realm of our social life in which something approaching public opinion can be formed.", author: "Jürgen Habermas", cat: "sea", source: "The Structural Transformation of the Public Sphere, 1962" },
    { text: "Man's task in life is to give birth to himself.", author: "Erich Fromm", cat: "fire", source: "Man for Himself, 1947" },
    { text: "Where there is power, there is resistance.", author: "Michel Foucault", cat: "lightning", source: "The History of Sexuality, Vol. 1, 1976" },
    { text: "To think is to experiment.", author: "Gilles Deleuze", cat: "wind" },
    { text: "Creation lies just as much in the invention of new social relations as in the making of objects.", author: "Félix Guattari", cat: "fire" },
    { text: "Deconstruction is not a method and cannot be transformed into one.", author: "Jacques Derrida", cat: "void", source: "Letter to a Japanese Friend, 1985" },
    { text: "All that once was directly lived has become mere representation.", author: "Guy Debord", cat: "void", source: "The Society of the Spectacle, 1967" },
    { text: "The territory no longer precedes the map.", author: "Jean Baudrillard", cat: "sea", source: "Simulacra and Simulation, 1981" },
    { text: "The most successful ideological effects are those which have no need for words, and ask no more than complicitous silence.", author: "Pierre Bourdieu", cat: "stone", source: "Outline of a Theory of Practice, 1972" },
    { text: "Emancipation begins when we challenge the opposition between viewing and acting.", author: "Jacques Rancière", cat: "lightning", source: "The Emancipated Spectator, 2008" },
    { text: "Love is always the possibility of being present at the birth of the world.", author: "Alain Badiou", cat: "fire", source: "In Praise of Love, 2009" },
    { text: "Ecology is the new opium of the masses.", author: "Slavoj Žižek", cat: "stone" },
    { text: "Empire is materializing before our very eyes.", author: "Antonio Negri", cat: "void", source: "Empire (with Michael Hardt), 2000" },
    { text: "Autonomy means, precisely, to give oneself one's own law.", author: "Cornelius Castoriadis", cat: "stone" },
    { text: "What the map cuts up, the story cuts across.", author: "Michel de Certeau", cat: "sea", source: "The Practice of Everyday Life, 1980" },
    { text: "Ideology has no history.", author: "Louis Althusser", cat: "void", source: "Ideology and Ideological State Apparatuses, 1970" },
    { text: "The birth of the reader must be at the cost of the death of the Author.", author: "Roland Barthes", cat: "void", source: "The Death of the Author, 1967" },
    { text: "Simplifying to the extreme, I define postmodern as incredulity toward metanarratives.", author: "Jean-François Lyotard", cat: "void", source: "The Postmodern Condition, 1979" },
    { text: "Each generation must, out of relative obscurity, discover its mission, fulfill it, or betray it.", author: "Frantz Fanon", cat: "fire", source: "The Wretched of the Earth, 1961" },
    { text: "There is room for everyone at the rendezvous of victory.", author: "Aimé Césaire", cat: "lightning", source: "Notebook of a Return to My Native Land, 1939" },
    { text: "Emotion is black, as reason is Greek.", author: "Léopold Sédar Senghor", cat: "void" },
    { text: "Every empire, however, tells itself and the world that it is unlike all other empires.", author: "Edward Said", cat: "stone", source: "Culture and Imperialism, 1993" },
    { text: "The subaltern cannot speak.", author: "Gayatri Chakravorty Spivak", cat: "void", source: "Can the Subaltern Speak?, 1988" },
    { text: "Tell no lies, claim no easy victories.", author: "Amílcar Cabral", cat: "lightning", source: "guidance to PAIGC cadres, 1965" },
    { text: "You cannot carry out fundamental change without a certain amount of madness.", author: "Thomas Sankara", cat: "fire", source: "speech, 1985" },
    { text: "African development is possible only on the basis of a radical break with the international capitalist system.", author: "Walter Rodney", cat: "stone", source: "How Europe Underdeveloped Africa, 1972" },
    { text: "What do they know of cricket who only cricket know?", author: "C.L.R. James", cat: "wind", source: "Beyond a Boundary, 1963" },
    { text: "Washing one's hands of the conflict between the powerful and the powerless means to side with the powerful, not to be neutral.", author: "Paulo Freire", cat: "lightning", source: "Pedagogy of the Oppressed, 1968" },
    { text: "The division of labor among nations is that some specialize in winning and others in losing.", author: "Eduardo Galeano", cat: "stone", source: "Open Veins of Latin America, 1971" },
    { text: "We certainly do not want socialism in Latin America to be a copy and imitation; it must be a heroic creation.", author: "José Carlos Mariátegui", cat: "fire", source: "Seven Interpretive Essays on Peruvian Reality, 1928" },
    { text: "Hybridity is the sign of the productivity of colonial power.", author: "Homi K. Bhabha", cat: "void" },
    { text: "The bullet was the means of the physical subjugation. Language was the means of the spiritual subjugation.", author: "Ngũgĩ wa Thiong'o", cat: "stone", source: "Decolonising the Mind, 1986" },
    { text: "Popular culture is one of the sites where this struggle for and against a culture of the powerful is engaged.", author: "Stuart Hall", cat: "sea", source: "Notes on Deconstructing 'the Popular', 1981" },
    { text: "The passion for destruction is a creative passion, too.", author: "Mikhail Bakunin", cat: "lightning", source: "The Reaction in Germany, 1842" },
    { text: "The need for mutual help and support is a great deal more developed than the fact of mutual struggle.", author: "Peter Kropotkin", cat: "sea", source: "Mutual Aid: A Factor of Evolution, 1902" },
    { text: "Ask for work. If they do not give you work, ask for bread. If they do not give you work or bread, then take bread.", author: "Emma Goldman", cat: "fire", source: "speech, Union Square, New York, 1893" },
    { text: "The consciousness of one's own dignity is essential for a slave to become a rebel.", author: "Errico Malatesta", cat: "stone" },
    { text: "The domination of human by human is rooted in the domination of nature by human.", author: "Murray Bookchin", cat: "void", source: "The Ecology of Freedom, 1982" },
    { text: "Property is theft!", author: "Pierre-Joseph Proudhon", cat: "stone", source: "What Is Property?, 1840" },
    { text: "Anarchism is not a fixed, self-enclosed social system but rather a definite trend in the historic development of mankind.", author: "Rudolf Rocker", cat: "void", source: "Anarcho-Syndicalism, 1938" },
    { text: "Anarchism means that you should be free; that no one should enslave you, boss you, rob you, or impose upon you.", author: "Alexander Berkman", cat: "lightning", source: "What Is Communist Anarchism?, 1929" },
    { text: "The revolution is not an apple that falls when it is ripe. You have to make it fall.", author: "Che Guevara", cat: "fire" },
    { text: "Condemn me, it does not matter. History will absolve me.", author: "Fidel Castro", cat: "lightning", source: "'History Will Absolve Me' speech, 1953" },
    { text: "They have the force, they will be able to dominate us, but social processes can be arrested by neither crime nor force.", author: "Salvador Allende", cat: "stone", source: "final radio address, 11 September 1973" },
    { text: "We want a world where many worlds fit.", author: "Subcomandante Marcos", cat: "void", source: "Zapatista communiqué, 1996" },
    { text: "Nothing is more precious than independence and freedom.", author: "Ho Chi Minh", cat: "lightning", source: "appeal to compatriots, 1966" },
    { text: "A single spark can start a prairie fire.", author: "Mao Zedong", cat: "fire", source: "letter, 1930" },
    { text: "Unity will not make us rich, but it can make it difficult for Africa and the African peoples to be disregarded and humiliated.", author: "Julius Nyerere", cat: "stone" },
    { text: "In order for nonviolence to work, your opponent must have a conscience.", author: "Kwame Ture", cat: "void" },
    { text: "The problem of the twentieth century is the problem of the color line.", author: "W.E.B. Du Bois", cat: "lightning", source: "The Souls of Black Folk, 1903" },
    { text: "I am no longer accepting the things I cannot change, I am changing the things I cannot accept.", author: "Angela Davis", cat: "fire" },
    { text: "The moment we choose to love we begin to move against domination.", author: "bell hooks", cat: "sea", source: "All About Love: New Visions, 2000" },
    { text: "The master's tools will never dismantle the master's house.", author: "Audre Lorde", cat: "stone", source: "Sister Outsider, 1984" },
    { text: "We are the ones we have been waiting for.", author: "June Jordan", cat: "void", source: "Poem for South African Women, 1978" },
    { text: "You can't be neutral on a moving train.", author: "Howard Zinn", cat: "wind", source: "You Can't Be Neutral on a Moving Train, 1994" },
    { text: "Not everything that is faced can be changed, but nothing can be changed until it is faced.", author: "James Baldwin", cat: "lightning", source: "As Much Truth As One Can Bear, 1962" },
    { text: "A man who stands for nothing will fall for anything.", author: "Malcolm X", cat: "stone" },
    { text: "There is no gender identity behind the expressions of gender.", author: "Judith Butler", cat: "void", source: "Gender Trouble, 1990" },
    { text: "Justice requires social arrangements that permit all to participate as peers in social life.", author: "Nancy Fraser", cat: "sea" },
    { text: "Writing is impossible without some kind of exile.", author: "Julia Kristeva", cat: "void" },
    { text: "Woman must write her self.", author: "Hélène Cixous", cat: "fire", source: "The Laugh of the Medusa, 1975" },
    { text: "If we continue to speak in this sameness, we speak as men have spoken for centuries.", author: "Luce Irigaray", cat: "stone" },
    { text: "Patriarchy's chief institution is the family.", author: "Kate Millett", cat: "stone", source: "Sexual Politics, 1970" },
    { text: "In a time of universal deceit, telling the truth is a revolutionary act.", author: "George Orwell", cat: "lightning" },
    { text: "Because things are the way they are, things will not stay the way they are.", author: "Bertolt Brecht", cat: "fire", source: "Speech to Danish Working-Class Actors, 1934" },
    { text: "You can cut all the flowers but you cannot keep spring from coming.", author: "Pablo Neruda", cat: "fire" },
    { text: "The bond between colonizer and colonized is thus destructive and creative.", author: "Albert Memmi", cat: "stone", source: "The Colonizer and the Colonized, 1957" },
    { text: "There is no such thing as happy love.", author: "Louis Aragon", cat: "rain", source: "'Il n'y a pas d'amour heureux', 1943" },
    { text: "There is another world, but it is in this one.", author: "Paul Éluard", cat: "void" },
    { text: "Only mystery allows us to live, only mystery.", author: "Federico García Lorca", cat: "void" },
    { text: "The only journey is the one within.", author: "Rainer Maria Rilke", cat: "void" },
    { text: "There is only one heroism in the world: to see the world as it is, and to love it.", author: "Romain Rolland", cat: "fire" },
    { text: "The man of action lends a kind of nobility to whatever he does.", author: "Victor Serge", cat: "wind" },
    { text: "We are living through the end of capitalism as a historical system.", author: "Immanuel Wallerstein", cat: "void" },
    { text: "Capitalism never solves its crisis problems, it just moves them around geographically.", author: "David Harvey", cat: "stone" },
    { text: "Capitalism is not just a set of policies; it is a social system.", author: "Ellen Meiksins Wood", cat: "void" },
    { text: "History is not a smooth process of accumulation.", author: "Perry Anderson", cat: "stone" },
    { text: "Culture is one of the two or three most complicated words in the English language.", author: "Terry Eagleton", cat: "void", source: "The Idea of Culture, 2000" },
    { text: "It is easier to imagine the end of the world than to imagine the end of capitalism.", author: "Fredric Jameson", cat: "void" },
    { text: "To be truly radical is to make hope possible, rather than despair convincing.", author: "Raymond Williams", cat: "lightning", source: "Resources of Hope, 1989" },
    { text: "I am seeking to rescue the poor from the enormous condescension of posterity.", author: "E.P. Thompson", cat: "stone", source: "The Making of the English Working Class, 1963" },
    { text: "The destruction of the past is one of the most characteristic phenomena of the late twentieth century.", author: "Eric Hobsbawm", cat: "void", source: "Age of Extremes, 1994" },
    { text: "Class struggle is the heart of politics.", author: "Ralph Miliband", cat: "stone" },
    { text: "It is better to die on your feet than to live on your knees.", author: "Dolores Ibárruri", cat: "lightning", source: "radio speech, Madrid, 1936" },
    { text: "We are not in the least afraid of ruins.", author: "Buenaventura Durruti", cat: "fire", source: "interview with Pierre van Paassen, 1936" },
    { text: "Traveler, there is no path. The path is made by walking.", author: "Antonio Machado", cat: "wind", source: "Proverbios y cantares, 1912" },
    { text: "I grew up among cannons and set my songs to their explosions.", author: "Miguel Hernández", cat: "rain" },
    { text: "Solidarity is not a matter of sentiment but a fact, cold and hard.", author: "Samora Machel", cat: "stone" },
    { text: "The path of the future passes through struggle.", author: "Agostinho Neto", cat: "lightning" },
    { text: "There is only one race, the human race.", author: "Robert Sobukwe", cat: "void" },

  var canvas = document.getElementById("scene");
  var ctx = canvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  var CATS = {
    lightning: { rgb: "230,235,255", mode: "bolt" },
    sea:       { rgb: "90,150,160",  mode: "wave" },
    wind:      { rgb: "190,195,198", mode: "streak" },
    fire:      { rgb: "224,126,72",  mode: "ember" },
    stone:     { rgb: "150,140,124", mode: "fog" },
    void:      { rgb: "138,138,196", mode: "stars" },
    rain:      { rgb: "120,150,180", mode: "rain" }
  };

  var current = "void";
  var particles = [];
  var boltPath = null;
  var boltLife = 0;
  var nextBoltAt = 0;
  var strikePath = null;
  var strikeLife = 0;
  var t0 = performance.now();
  var lastT = t0;

  function rand(a, b) { return a + Math.random() * (b - a); }

  function seedParticles(cat) {
    particles = [];
    var mode = CATS[cat].mode;
    var count;
    if (mode === "wave") count = 6;
    else if (mode === "streak") count = 46;
    else if (mode === "ember") count = 70;
    else if (mode === "stars") count = 110;
    else if (mode === "rain") count = 130;
    else count = 0;

    for (var i = 0; i < count; i++) {
      if (mode === "wave") {
        particles.push({ phase: rand(0, Math.PI * 2), amp: rand(6, 26), speed: rand(0.15, 0.4), y: H * (0.55 + i * 0.06), wobble: rand(60, 140) });
      } else if (mode === "streak") {
        particles.push({ x: rand(-200, W), y: rand(0, H), len: rand(60, 220), speed: rand(260, 520), o: rand(0.08, 0.3) });
      } else if (mode === "ember") {
        particles.push({ x: rand(0, W), y: rand(H * 0.4, H + 40), r: rand(0.6, 2.2), speed: rand(14, 46), drift: rand(-8, 8), o: rand(0.15, 0.55), flick: rand(0, 10) });
      } else if (mode === "stars") {
        particles.push({ x: rand(0, W), y: rand(0, H), r: rand(0.4, 1.6), tw: rand(0, 10), speed: rand(1, 6), o: rand(0.2, 0.9) });
      } else if (mode === "rain") {
        particles.push({ x: rand(0, W), y: rand(-H, H), len: rand(14, 34), speed: rand(500, 900), o: rand(0.12, 0.4) });
      }
    }
    boltPath = null;
    boltLife = 0;
    nextBoltAt = performance.now() + rand(400, 1600);
  }

  function makeBolt() {
    var pts = [];
    var x = rand(W * 0.3, W * 0.7);
    var y = 0;
    pts.push([x, y]);
    while (y < H * 0.62) {
      x += rand(-46, 46);
      y += rand(28, 60);
      pts.push([x, y]);
    }
    return pts;
  }

  function draw(now) {
    var dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    var cfg = CATS[current];
    ctx.clearRect(0, 0, W, H);

    var grad = ctx.createRadialGradient(W / 2, H * 0.42, 0, W / 2, H * 0.42, Math.max(W, H) * 0.75);
    grad.addColorStop(0, "rgba(" + cfg.rgb + ",0.05)");
    grad.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    if (cfg.mode === "wave") {
      particles.forEach(function (p, i) {
        p.phase += dt * p.speed;
        ctx.beginPath();
        for (var x = 0; x <= W; x += 8) {
          var yy = p.y + Math.sin(x / p.wobble + p.phase) * p.amp;
          if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
        }
        ctx.strokeStyle = "rgba(" + cfg.rgb + "," + (0.08 + i * 0.015) + ")";
        ctx.lineWidth = 1;
        ctx.stroke();
      });
    } else if (cfg.mode === "streak") {
      particles.forEach(function (p) {
        p.x += p.speed * dt;
        if (p.x > W + 220) { p.x = -220; p.y = rand(0, H); }
        ctx.strokeStyle = "rgba(" + cfg.rgb + "," + p.o + ")";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + p.len, p.y + p.len * 0.06);
        ctx.stroke();
      });
    } else if (cfg.mode === "ember") {
      particles.forEach(function (p) {
        p.y -= p.speed * dt;
        p.x += p.drift * dt;
        p.flick += dt * 6;
        if (p.y < H * 0.1) { p.y = H + rand(0, 40); p.x = rand(0, W); }
        var o = p.o * (0.6 + 0.4 * Math.sin(p.flick));
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(" + cfg.rgb + "," + o + ")";
        ctx.fill();
      });
    } else if (cfg.mode === "stars") {
      particles.forEach(function (p) {
        p.tw += dt * 1.4;
        p.y += p.speed * dt * 0.06;
        p.x -= p.speed * dt * 0.03;
        if (p.y > H) p.y = 0;
        if (p.x < 0) p.x = W;
        var o = p.o * (0.5 + 0.5 * Math.sin(p.tw));
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(" + cfg.rgb + "," + o + ")";
        ctx.fill();
      });
    } else if (cfg.mode === "rain") {
      particles.forEach(function (p) {
        p.y += p.speed * dt;
        if (p.y > H) { p.y = -p.len; p.x = rand(0, W); }
        ctx.strokeStyle = "rgba(" + cfg.rgb + "," + p.o + ")";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - 4, p.y + p.len);
        ctx.stroke();
      });
    } else if (cfg.mode === "fog") {
      for (var i = 0; i < 4; i++) {
        var yBase = H * (0.55 + i * 0.1);
        var shift = Math.sin(now / 4000 + i) * 30;
        var g = ctx.createLinearGradient(0, yBase - 40, 0, yBase + 40);
        g.addColorStop(0, "rgba(" + cfg.rgb + ",0)");
        g.addColorStop(0.5, "rgba(" + cfg.rgb + "," + (0.05 + i * 0.015) + ")");
        g.addColorStop(1, "rgba(" + cfg.rgb + ",0)");
        ctx.fillStyle = g;
        ctx.fillRect(shift - 60, yBase - 40, W + 120, 80);
      }
      ctx.beginPath();
      ctx.moveTo(0, H);
      var seedRand = 91 + Math.floor(now / 999999);
      for (var x2 = 0; x2 <= W; x2 += W / 14) {
        var hgt = H * 0.72 + Math.sin(x2 * 0.01 + seedRand) * 30;
        ctx.lineTo(x2, hgt);
      }
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fill();
    } else if (cfg.mode === "bolt") {
      if (now > nextBoltAt && boltLife <= 0) {
        boltPath = makeBolt();
        boltLife = 0.12;
        flashScreen(0.5);
        nextBoltAt = now + rand(1200, 3400);
      }
      if (boltPath && boltLife > 0) {
        boltLife -= dt;
        ctx.save();
        ctx.shadowBlur = 18;
        ctx.shadowColor = "rgba(" + cfg.rgb + ",0.9)";
        ctx.strokeStyle = "rgba(" + cfg.rgb + "," + Math.min(1, boltLife * 6) + ")";
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        boltPath.forEach(function (pt, i) {
          if (i === 0) ctx.moveTo(pt[0], pt[1]); else ctx.lineTo(pt[0], pt[1]);
        });
        ctx.stroke();
        ctx.restore();
      }
    }

    if (strikeLife > 0 && strikePath) {
      strikeLife -= dt;
      ctx.save();
      ctx.shadowBlur = 26;
      ctx.shadowColor = "rgba(235,240,255,0.95)";
      ctx.strokeStyle = "rgba(235,240,255," + Math.min(1, strikeLife * 3.4) + ")";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      strikePath.forEach(function (pt, i) {
        if (i === 0) ctx.moveTo(pt[0], pt[1]); else ctx.lineTo(pt[0], pt[1]);
      });
      ctx.stroke();
      ctx.restore();
    }

    if (!reduceMotion) requestAnimationFrame(draw);
  }

  function flashScreen(strength) {
    var el = document.getElementById("flash");
    el.style.opacity = String(strength);
    requestAnimationFrame(function () {
      el.style.transition = "opacity 0.5s ease";
      el.style.opacity = "0";
      setTimeout(function () { el.style.transition = ""; }, 520);
    });
  }

  function triggerStrike() {
    if (reduceMotion) {
      flashScreen(0.35);
      return;
    }
    strikePath = makeBolt();
    strikeLife = 0.4;
    flashScreen(0.85);
    setTimeout(function () { flashScreen(0.35); }, 100);
  }

  seedParticles(current);
  if (reduceMotion) {
    draw(performance.now());
  } else {
    requestAnimationFrame(draw);
  }

  var stage = document.getElementById("stage");
  var quoteText = document.getElementById("quoteText");
  var quoteAuthor = document.getElementById("quoteAuthor");
  var quoteSource = document.getElementById("quoteSource");
  var quoteBlock = document.getElementById("quoteBlock");
  var promptEl = document.getElementById("prompt");
  var reelIndex = document.getElementById("reelIndex");
  var flashEl = document.getElementById("flash");
  var lastIdx = -1;
  var used = false;

  function pick() {
    var i;
    do { i = Math.floor(Math.random() * quotes.length); } while (i === lastIdx && quotes.length > 1);
    lastIdx = i;
    return quotes[i];
  }

  function draw2() {
    var q = pick();
    current = q.cat;
    seedParticles(current);

    quoteText.classList.remove("visible");
    quoteAuthor.classList.remove("visible");
    quoteSource.classList.remove("visible");
    quoteBlock.parentElement.classList.add("glitching");
    triggerStrike();

    setTimeout(function () {
      quoteText.textContent = "“" + q.text + "”";
      quoteAuthor.textContent = q.author;
      quoteText.classList.add("visible");
      quoteAuthor.classList.add("visible");
      if (q.source) {
        quoteSource.textContent = q.source;
        quoteSource.classList.add("visible");
      } else {
        quoteSource.textContent = "";
      }
      quoteBlock.parentElement.classList.remove("glitching");
    }, 160);

    reelIndex.textContent = "N° " + String(lastIdx + 1).padStart(2, "0") + " / " + quotes.length;
    if (!used) {
      used = true;
      promptEl.textContent = "Press for another";
    }
  }

  stage.addEventListener("click", draw2);

  function pad(n) { return String(n).padStart(2, "0"); }
  function tick() {
    var elapsed = (performance.now() - t0) / 1000;
    var h = Math.floor(elapsed / 3600);
    var m = Math.floor((elapsed % 3600) / 60);
    var s = Math.floor(elapsed % 60);
    var f = Math.floor((elapsed % 1) * 24);
    document.getElementById("timecode").textContent = pad(h) + ":" + pad(m) + ":" + pad(s) + ":" + pad(f);
    if (!reduceMotion) requestAnimationFrame(tick);
  }
  if (!reduceMotion) requestAnimationFrame(tick); else document.getElementById("timecode").textContent = "00:00:00:00";
})();
</script>

</body>
</html>
