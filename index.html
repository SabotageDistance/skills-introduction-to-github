  :root {
    --bg: #060606;
    --fg: #f3f1ec;
    --muted: rgba(243, 241, 236, 0.5);
    --hairline: rgba(243, 241, 236, 0.14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  body {
    color: var(--fg);
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  canvas#scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 38%, rgba(0,0,0,0.55) 78%, rgba(0,0,0,0.85) 100%);
    z-index: 5;
  }

  .grain {
    position: fixed;
    inset: -50px;
    pointer-events: none;
    z-index: 6;
    opacity: 0.05;
    mix-blend-mode: overlay;
    background-image:
      radial-gradient(circle, #fff 0.6px, transparent 0.6px);
    background-size: 3px 3px;
    animation: grain-shift 0.4s steps(4) infinite;
  }

  @keyframes grain-shift {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(-1.5px, 1px); }
    50%  { transform: translate(1px, -1.5px); }
    75%  { transform: translate(-1px, -1px); }
    100% { transform: translate(1.5px, 1.5px); }
  }

  .scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 7;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.035) 0px,
      rgba(255,255,255,0.035) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
  }

  .flicker {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 8;
    background: #fff;
    opacity: 0;
    animation: flicker 6s ease-in-out infinite;
  }

  @keyframes flicker {
    0%, 96%, 100% { opacity: 0; }
    97% { opacity: 0.02; }
    98% { opacity: 0; }
    98.5% { opacity: 0.015; }
  }

  .flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    background: #fff;
    opacity: 0;
  }

  .flash.pulse {
    animation: flash-pulse 0.38s ease-out;
  }

  @keyframes flash-pulse {
    0% { opacity: 0.85; }
    100% { opacity: 0; }
  }

  .hud {
    position: fixed;
    top: 1.4rem;
    left: 1.6rem;
    z-index: 10;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .hud .rec-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #c94b3f;
    box-shadow: 0 0 6px 1px rgba(201, 75, 63, 0.8);
    animation: rec-blink 1.6s ease-in-out infinite;
  }

  @keyframes rec-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  .index {
    position: fixed;
    top: 1.4rem;
    right: 1.6rem;
    z-index: 10;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .stage-btn {
    position: fixed;
    inset: 0;
    z-index: 15;
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    margin: 0;
    padding: 0;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    color: inherit;
    font: inherit;
  }

  .stage-btn:focus-visible {
    outline: none;
  }

  .stage-btn:focus-visible .quote-block {
    outline: 1px solid var(--hairline);
    outline-offset: 12px;
  }

  .quote-block {
    width: 100%;
    max-width: 900px;
    padding: 0 1.75rem;
    margin-bottom: 12vh;
    text-align: center;
  }

  .quote-text {
    font-family: "Bebas Neue", "Arial Narrow", "Helvetica Neue Condensed", sans-serif;
    font-weight: 400;
    font-size: clamp(1.9rem, 6.2vw, 3.6rem);
    line-height: 1.05;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    text-wrap: balance;
    margin: 0 0 1.1rem;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .quote-text.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .quote-author {
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.6s ease 0.1s;
  }

  .quote-author.visible {
    opacity: 1;
  }

  .quote-author::before {
    content: "\2014  ";
  }

  .quote-source {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    font-style: italic;
    color: var(--muted);
    opacity: 0;
    margin: 0.4rem 0 0;
    transition: opacity 0.6s ease 0.2s;
  }

  .quote-source.visible {
    opacity: 0.7;
  }

  .prompt {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.65rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 1.6rem;
    animation: pulse-op 2.6s ease-in-out infinite;
  }

  @keyframes pulse-op {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.9; }
  }

  .glitching .quote-text {
    animation: glitch-text 0.32s steps(2, end);
  }

  @keyframes glitch-text {
    0%   { transform: translate(0, 0); text-shadow: none; }
    15%  { transform: translate(-3px, 1px); text-shadow: 2px 0 #c94b3f, -2px 0 #3f8fc9; }
    30%  { transform: translate(2px, -1px); text-shadow: -2px 0 #c94b3f, 2px 0 #3f8fc9; }
    45%  { transform: translate(-2px, 0); text-shadow: 2px 0 #c94b3f, -2px 0 #3f8fc9; }
    60%  { transform: translate(1px, 1px); text-shadow: none; }
    100% { transform: translate(0, 0); text-shadow: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .grain, .flicker, .hud .rec-dot, .prompt { animation: none; }
    .quote-text, .quote-author, .quote-source { transition: none; }
    .glitching .quote-text { animation: none; }
  }
</style>
</head>
<body>

<canvas id="scene" aria-hidden="true"></canvas>
<div class="vignette"></div>
<div class="grain"></div>
<div class="scanlines"></div>
<div class="flicker"></div>
<div class="flash" id="flash"></div>

<div class="hud"><span class="rec-dot"></span><span id="timecode">00:00:00:00</span></div>
<div class="index" id="reelIndex">N&deg; 00 / 100</div>

<button class="stage-btn" id="stage" type="button" aria-label="Draw a quote">
  <div class="quote-block" id="quoteBlock">
    <p class="quote-text" id="quoteText">Press to draw a fortune</p>
    <p class="quote-author" id="quoteAuthor"></p>
    <p class="quote-source" id="quoteSource"></p>
  </div>
  <div class="prompt" id="prompt">Press anywhere to draw</div>
</button>

  var canvas = document.getElementById("scene");
  var ctx = canvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  var CATS = {
    lightning: { rgb: "230,235,255", mode: "bolt" },
    sea:       { rgb: "90,150,160",  mode: "wave" },
    wind:      { rgb: "190,195,198", mode: "streak" },
    fire:      { rgb: "224,126,72",  mode: "ember" },
    stone:     { rgb: "150,140,124", mode: "fog" },
    void:      { rgb: "138,138,196", mode: "stars" },
    rain:      { rgb: "120,150,180", mode: "rain" }
  };

  var current = "void";
  var particles = [];
  var boltPath = null;
  var boltLife = 0;
  var nextBoltAt = 0;
  var t0 = performance.now();
  var lastT = t0;

  function rand(a, b) { return a + Math.random() * (b - a); }

  function seedParticles(cat) {
    particles = [];
    var mode = CATS[cat].mode;
    var count;
    if (mode === "wave") count = 6;
    else if (mode === "streak") count = 46;
    else if (mode === "ember") count = 70;
    else if (mode === "stars") count = 110;
    else if (mode === "rain") count = 130;
    else count = 0;

    for (var i = 0; i < count; i++) {
      if (mode === "wave") {
        particles.push({ phase: rand(0, Math.PI * 2), amp: rand(6, 26), speed: rand(0.15, 0.4), y: H * (0.55 + i * 0.06), wobble: rand(60, 140) });
      } else if (mode === "streak") {
        particles.push({ x: rand(-200, W), y: rand(0, H), len: rand(60, 220), speed: rand(260, 520), o: rand(0.08, 0.3) });
      } else if (mode === "ember") {
        particles.push({ x: rand(0, W), y: rand(H * 0.4, H + 40), r: rand(0.6, 2.2), speed: rand(14, 46), drift: rand(-8, 8), o: rand(0.15, 0.55), flick: rand(0, 10) });
      } else if (mode === "stars") {
        particles.push({ x: rand(0, W), y: rand(0, H), r: rand(0.4, 1.6), tw: rand(0, 10), speed: rand(1, 6), o: rand(0.2, 0.9) });
      } else if (mode === "rain") {
        particles.push({ x: rand(0, W), y: rand(-H, H), len: rand(14, 34), speed: rand(500, 900), o: rand(0.12, 0.4) });
      }
    }
    boltPath = null;
    boltLife = 0;
    nextBoltAt = performance.now() + rand(400, 1600);
  }

  function makeBolt() {
    var pts = [];
    var x = rand(W * 0.3, W * 0.7);
    var y = 0;
    pts.push([x, y]);
    while (y < H * 0.62) {
      x += rand(-46, 46);
      y += rand(28, 60);
      pts.push([x, y]);
    }
    return pts;
  }

  function draw(now) {
    var dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    var cfg = CATS[current];
    ctx.clearRect(0, 0, W, H);

    var grad = ctx.createRadialGradient(W / 2, H * 0.42, 0, W / 2, H * 0.42, Math.max(W, H) * 0.75);
    grad.addColorStop(0, "rgba(" + cfg.rgb + ",0.05)");
    grad.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    if (cfg.mode === "wave") {
      particles.forEach(function (p, i) {
        p.phase += dt * p.speed;
        ctx.beginPath();
        for (var x = 0; x <= W; x += 8) {
          var yy = p.y + Math.sin(x / p.wobble + p.phase) * p.amp;
          if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
        }
        ctx.strokeStyle = "rgba(" + cfg.rgb + "," + (0.08 + i * 0.015) + ")";
        ctx.lineWidth = 1;
        ctx.stroke();
      });
    } else if (cfg.mode === "streak") {
      particles.forEach(function (p) {
        p.x += p.speed * dt;
        if (p.x > W + 220) { p.x = -220; p.y = rand(0, H); }
        ctx.strokeStyle = "rgba(" + cfg.rgb + "," + p.o + ")";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + p.len, p.y + p.len * 0.06);
        ctx.stroke();
      });
    } else if (cfg.mode === "ember") {
      particles.forEach(function (p) {
        p.y -= p.speed * dt;
        p.x += p.drift * dt;
        p.flick += dt * 6;
        if (p.y < H * 0.1) { p.y = H + rand(0, 40); p.x = rand(0, W); }
        var o = p.o * (0.6 + 0.4 * Math.sin(p.flick));
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(" + cfg.rgb + "," + o + ")";
        ctx.fill();
      });
    } else if (cfg.mode === "stars") {
      particles.forEach(function (p) {
        p.tw += dt * 1.4;
        p.y += p.speed * dt * 0.06;
        p.x -= p.speed * dt * 0.03;
        if (p.y > H) p.y = 0;
        if (p.x < 0) p.x = W;
        var o = p.o * (0.5 + 0.5 * Math.sin(p.tw));
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(" + cfg.rgb + "," + o + ")";
        ctx.fill();
      });
    } else if (cfg.mode === "rain") {
      particles.forEach(function (p) {
        p.y += p.speed * dt;
        if (p.y > H) { p.y = -p.len; p.x = rand(0, W); }
        ctx.strokeStyle = "rgba(" + cfg.rgb + "," + p.o + ")";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - 4, p.y + p.len);
        ctx.stroke();
      });
    } else if (cfg.mode === "fog") {
      for (var i = 0; i < 4; i++) {
        var yBase = H * (0.55 + i * 0.1);
        var shift = Math.sin(now / 4000 + i) * 30;
        var g = ctx.createLinearGradient(0, yBase - 40, 0, yBase + 40);
        g.addColorStop(0, "rgba(" + cfg.rgb + ",0)");
        g.addColorStop(0.5, "rgba(" + cfg.rgb + "," + (0.05 + i * 0.015) + ")");
        g.addColorStop(1, "rgba(" + cfg.rgb + ",0)");
        ctx.fillStyle = g;
        ctx.fillRect(shift - 60, yBase - 40, W + 120, 80);
      }
      ctx.beginPath();
      ctx.moveTo(0, H);
      var seedRand = 91 + Math.floor(now / 999999);
      for (var x2 = 0; x2 <= W; x2 += W / 14) {
        var hgt = H * 0.72 + Math.sin(x2 * 0.01 + seedRand) * 30;
        ctx.lineTo(x2, hgt);
      }
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fill();
    } else if (cfg.mode === "bolt") {
      if (now > nextBoltAt && boltLife <= 0) {
        boltPath = makeBolt();
        boltLife = 0.12;
        flashScreen(0.5);
        nextBoltAt = now + rand(1200, 3400);
      }
      if (boltPath && boltLife > 0) {
        boltLife -= dt;
        ctx.save();
        ctx.shadowBlur = 18;
        ctx.shadowColor = "rgba(" + cfg.rgb + ",0.9)";
        ctx.strokeStyle = "rgba(" + cfg.rgb + "," + Math.min(1, boltLife * 6) + ")";
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        boltPath.forEach(function (pt, i) {
          if (i === 0) ctx.moveTo(pt[0], pt[1]); else ctx.lineTo(pt[0], pt[1]);
        });
        ctx.stroke();
        ctx.restore();
      }
    }

    if (!reduceMotion) requestAnimationFrame(draw);
  }

  function flashScreen(strength) {
    var el = document.getElementById("flash");
    el.style.opacity = String(strength);
    requestAnimationFrame(function () {
      el.style.transition = "opacity 0.5s ease";
      el.style.opacity = "0";
      setTimeout(function () { el.style.transition = ""; }, 520);
    });
  }

  seedParticles(current);
  if (reduceMotion) {
    draw(performance.now());
  } else {
    requestAnimationFrame(draw);
  }

  var stage = document.getElementById("stage");
  var quoteText = document.getElementById("quoteText");
  var quoteAuthor = document.getElementById("quoteAuthor");
  var quoteSource = document.getElementById("quoteSource");
  var quoteBlock = document.getElementById("quoteBlock");
  var promptEl = document.getElementById("prompt");
  var reelIndex = document.getElementById("reelIndex");
  var flashEl = document.getElementById("flash");
  var lastIdx = -1;
  var used = false;

  function pick() {
    var i;
    do { i = Math.floor(Math.random() * quotes.length); } while (i === lastIdx && quotes.length > 1);
    lastIdx = i;
    return quotes[i];
  }

  function draw2() {
    var q = pick();
    current = q.cat;
    seedParticles(current);

    quoteText.classList.remove("visible");
    quoteAuthor.classList.remove("visible");
    quoteSource.classList.remove("visible");
    quoteBlock.parentElement.classList.add("glitching");
    flashScreen(0.22);

    setTimeout(function () {
      quoteText.textContent = "“" + q.text + "”";
      quoteAuthor.textContent = q.author;
      quoteText.classList.add("visible");
      quoteAuthor.classList.add("visible");
      if (q.source) {
        quoteSource.textContent = q.source;
        quoteSource.classList.add("visible");
      } else {
        quoteSource.textContent = "";
      }
      quoteBlock.parentElement.classList.remove("glitching");
    }, 160);

    reelIndex.textContent = "N° " + String(lastIdx + 1).padStart(2, "0") + " / " + quotes.length;
    if (!used) {
      used = true;
      promptEl.textContent = "Press for another";
    }
  }

  stage.addEventListener("click", draw2);

  function pad(n) { return String(n).padStart(2, "0"); }
  function tick() {
    var elapsed = (performance.now() - t0) / 1000;
    var h = Math.floor(elapsed / 3600);
    var m = Math.floor((elapsed % 3600) / 60);
    var s = Math.floor(elapsed % 60);
    var f = Math.floor((elapsed % 1) * 24);
    document.getElementById("timecode").textContent = pad(h) + ":" + pad(m) + ":" + pad(s) + ":" + pad(f);
    if (!reduceMotion) requestAnimationFrame(tick);
  }
  if (!reduceMotion) requestAnimationFrame(tick); else document.getElementById("timecode").textContent = "00:00:00:00";
})();
</script>
