<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Madame Oracle's Fortune Machine</title>
<style>
  :root {
    --surface: #170809;
    --surface-2: #260d10;
    --machine: #3a1015;
    --machine-2: #2a0b0f;
    --trim: #d4a24c;
    --trim-bright: #f1c976;
    --ticket: #f4ead0;
    --ticket-ink: #2b1d12;
    --ticket-ink-soft: #6b5636;
    --bulb: #e3a13d;
    --text-primary: #f4ead0;
    --text-muted: #b9925c;
    --shadow: rgba(0, 0, 0, 0.55);
  }

  :root[data-theme="light"] {
    --surface: #f3e7c9;
    --surface-2: #ecdcb4;
    --machine: #6b1220;
    --machine-2: #560f1a;
    --trim: #b9862f;
    --trim-bright: #dcae52;
    --ticket: #fbf5e4;
    --ticket-ink: #2b1d12;
    --ticket-ink-soft: #6b5636;
    --bulb: #e8b354;
    --text-primary: #3a1015;
    --text-muted: #7a5a34;
    --shadow: rgba(60, 30, 10, 0.25);
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --surface: #f3e7c9;
      --surface-2: #ecdcb4;
      --machine: #6b1220;
      --machine-2: #560f1a;
      --trim: #b9862f;
      --trim-bright: #dcae52;
      --ticket: #fbf5e4;
      --ticket-ink: #2b1d12;
      --ticket-ink-soft: #6b5636;
      --bulb: #e8b354;
      --text-primary: #3a1015;
      --text-muted: #7a5a34;
      --shadow: rgba(60, 30, 10, 0.25);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.25rem;
    background:
      radial-gradient(ellipse at 50% -10%, var(--surface-2), transparent 60%),
      var(--surface);
    color: var(--text-primary);
    font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    transition: background 0.3s ease, color 0.3s ease;
  }

  .stage {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .marquee {
    font-family: "Bodoni MT", Didot, "Playfair Display", Georgia, serif;
    font-weight: 700;
    font-size: clamp(1.5rem, 6vw, 2.1rem);
    letter-spacing: 0.06em;
    color: var(--text-primary);
    margin: 0 0 0.35rem;
    text-wrap: balance;
  }

  .tagline {
    font-family: "Futura", "Century Gothic", "Trebuchet MS", sans-serif;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--text-muted);
    margin: 0 0 1.4rem;
  }

  .bulbs {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    margin-bottom: 1.4rem;
  }

  .bulbs span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--bulb);
    box-shadow: 0 0 6px 1px var(--bulb);
    animation: flicker 2.6s ease-in-out infinite;
  }

  .bulbs span:nth-child(odd) { animation-delay: 0.4s; }
  .bulbs span:nth-child(3n) { animation-delay: 0.9s; }
  .bulbs span:nth-child(5n) { animation-delay: 1.3s; }

  @keyframes flicker {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 1; }
  }

  .cabinet {
    position: relative;
    background:
      linear-gradient(180deg, var(--machine), var(--machine-2));
    border: 1px solid var(--trim);
    border-radius: 18px;
    padding: 1.9rem 1.6rem 1.6rem;
    box-shadow:
      0 18px 40px var(--shadow),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .window {
    position: relative;
    width: 148px;
    height: 148px;
    margin: 0 auto 1.4rem;
    border-radius: 50%;
    background:
      radial-gradient(circle at 38% 30%, rgba(255, 255, 255, 0.35), transparent 45%),
      radial-gradient(circle at 55% 60%, var(--surface-2), var(--machine-2) 75%);
    border: 6px solid var(--trim);
    box-shadow:
      0 0 0 2px var(--machine-2),
      inset 0 0 25px rgba(0, 0, 0, 0.55);
    overflow: hidden;
  }

  .window::after {
    content: "";
    position: absolute;
    inset: -40%;
    background: conic-gradient(
      from 0deg,
      transparent 0deg,
      rgba(241, 201, 118, 0.22) 40deg,
      transparent 90deg,
      transparent 300deg,
      rgba(241, 201, 118, 0.12) 340deg,
      transparent 360deg
    );
    animation: swirl 9s linear infinite;
  }

  .eye {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Bodoni MT", Didot, Georgia, serif;
    font-size: 2.1rem;
    color: var(--trim-bright);
    text-shadow: 0 0 10px rgba(241, 201, 118, 0.6);
  }

  @keyframes swirl {
    to { transform: rotate(360deg); }
  }

  .lever-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    margin-bottom: 0.4rem;
  }

  .pull-btn {
    font-family: "Futura", "Century Gothic", "Trebuchet MS", sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--machine-2);
    background: linear-gradient(180deg, var(--trim-bright), var(--trim));
    border: none;
    border-radius: 999px;
    padding: 0.85rem 1.7rem;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--machine-2), 0 6px 14px var(--shadow);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .pull-btn:hover { filter: brightness(1.05); }

  .pull-btn:active,
  .pull-btn.pressed {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--machine-2), 0 2px 8px var(--shadow);
  }

  .pull-btn:focus-visible {
    outline: 2px solid var(--trim-bright);
    outline-offset: 3px;
  }

  .slot {
    height: 8px;
    width: 70%;
    margin: 1.3rem auto 0;
    background: var(--machine-2);
    border-radius: 4px;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.7);
  }

  .ticket-tray {
    margin-top: -2px;
    display: flex;
    justify-content: center;
    overflow: visible;
  }

  .ticket {
    width: 84%;
    background: var(--ticket);
    color: var(--ticket-ink);
    border-radius: 0 0 10px 10px;
    padding: 0 1.1rem 1.15rem;
    box-shadow: 0 12px 22px var(--shadow);
    opacity: 0;
    max-height: 0;
    transform: translateY(-14px);
    transition: opacity 0.45s ease, transform 0.45s ease, max-height 0.45s ease;
    overflow: hidden;
  }

  .ticket.visible {
    opacity: 1;
    max-height: 320px;
    transform: translateY(0);
    padding-top: 0.2rem;
  }

  .ticket::before {
    content: "";
    display: block;
    height: 12px;
    margin: 0 -1.1rem 0.6rem;
    background-image: radial-gradient(circle, var(--machine) 6px, transparent 6.5px);
    background-size: 18px 16px;
    background-position: top center;
    background-repeat: repeat-x;
  }

  .ticket-number {
    font-family: "Courier New", ui-monospace, SFMono-Regular, monospace;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    color: var(--ticket-ink-soft);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .ticket-text {
    font-family: "Courier New", ui-monospace, SFMono-Regular, monospace;
    font-size: 0.98rem;
    line-height: 1.55;
    margin: 0 0 0.7rem;
  }

  .ticket-author {
    font-family: "Courier New", ui-monospace, SFMono-Regular, monospace;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    color: var(--ticket-ink-soft);
    text-align: right;
    margin: 0 0 0.9rem;
  }

  .ticket-author::before {
    content: "\2014 ";
  }

  .ticket-foot {
    font-family: "Courier New", ui-monospace, SFMono-Regular, monospace;
    font-size: 0.65rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ticket-ink-soft);
  }

  .theme-toggle {
    margin-top: 1.6rem;
    background: none;
    border: 1px solid var(--text-muted);
    color: var(--text-muted);
    font-family: "Futura", "Century Gothic", "Trebuchet MS", sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    cursor: pointer;
  }

  .theme-toggle:focus-visible {
    outline: 2px solid var(--trim-bright);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .bulbs span, .window::after { animation: none; }
    .pull-btn, .ticket { transition: none; }
  }
</style>
</head>
<body>

<main class="stage">
  <h1 class="marquee">Madame Oracle</h1>
  <p class="tagline">Automatic Fortune Machine &mdash; Real Wisdom From History</p>

  <div class="bulbs" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="cabinet">
    <div class="window" aria-hidden="true">
      <div class="eye">&#9788;</div>
    </div>

    <div class="lever-row">
      <button class="pull-btn" id="pullBtn" type="button">Pull for Fortune</button>
    </div>

    <div class="slot" aria-hidden="true"></div>
    <div class="ticket-tray">
      <div class="ticket" id="ticket" role="status" aria-live="polite">
        <div class="ticket-number" id="ticketNumber">No. 0000</div>
        <p class="ticket-text" id="ticketText"></p>
        <p class="ticket-author" id="ticketAuthor"></p>
        <div class="ticket-foot">Drawn From the Archive</div>
      </div>
    </div>
  </div>

  <button class="theme-toggle" id="themeToggle" type="button">Toggle Light / Dark</button>
</main>

<script>
  const quotes = [
    { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
    { text: "It always seems impossible until it's done.", author: "Nelson Mandela" },
    { text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt" },
    { text: "In the middle of every difficulty lies opportunity.", author: "Albert Einstein" },
    { text: "Whether you think you can, or you think you can't, you're right.", author: "Henry Ford" },
    { text: "The best way to predict the future is to invent it.", author: "Alan Kay" },
    { text: "What lies behind us and what lies before us are tiny matters compared to what lies within us.", author: "Ralph Waldo Emerson" },
    { text: "You must be the change you wish to see in the world.", author: "Mahatma Gandhi" },
    { text: "I have not failed. I've just found 10,000 ways that won't work.", author: "Thomas Edison" },
    { text: "The only limit to our realization of tomorrow will be our doubts of today.", author: "Franklin D. Roosevelt" },
    { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt" },
    { text: "The journey of a thousand miles begins with a single step.", author: "Lao Tzu" },
    { text: "Turn your wounds into wisdom.", author: "Oprah Winfrey" },
    { text: "I alone cannot change the world, but I can cast a stone across the water to create many ripples.", author: "Mother Teresa" },
    { text: "Nothing is impossible, the word itself says 'I'm possible.'", author: "Audrey Hepburn" },
    { text: "The way to get started is to quit talking and begin doing.", author: "Walt Disney" },
    { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill" },
    { text: "Twenty years from now you will be more disappointed by the things that you didn't do than by the ones you did do.", author: "Mark Twain" },
    { text: "It does not matter how slowly you go as long as you do not stop.", author: "Confucius" },
    { text: "Keep your face always toward the sunshine, and shadows will fall behind you.", author: "Walt Whitman" },
    { text: "We know what we are, but know not what we may be.", author: "William Shakespeare" },
    { text: "The best time to plant a tree was 20 years ago. The second best time is now.", author: "Chinese Proverb" },
    { text: "Fortune favors the bold.", author: "Virgil" },
    { text: "He who has a why to live can bear almost any how.", author: "Friedrich Nietzsche" },
    { text: "The unexamined life is not worth living.", author: "Socrates" },
    { text: "Nothing in life is to be feared, it is only to be understood.", author: "Marie Curie" },
    { text: "You may not control all the events that happen to you, but you can decide not to be reduced by them.", author: "Maya Angelou" },
    { text: "Although the world is full of suffering, it is also full of the overcoming of it.", author: "Helen Keller" }
  ];

  const pullBtn = document.getElementById('pullBtn');
  const ticket = document.getElementById('ticket');
  const ticketText = document.getElementById('ticketText');
  const ticketAuthor = document.getElementById('ticketAuthor');
  const ticketNumber = document.getElementById('ticketNumber');
  const themeToggle = document.getElementById('themeToggle');

  let lastIndex = -1;

  function pickQuote() {
    let index;
    do {
      index = Math.floor(Math.random() * quotes.length);
    } while (index === lastIndex && quotes.length > 1);
    lastIndex = index;
    return quotes[index];
  }

  function dispenseTicket() {
    pullBtn.classList.add('pressed');
    setTimeout(() => pullBtn.classList.remove('pressed'), 160);

    ticket.classList.remove('visible');

    setTimeout(() => {
      const quote = pickQuote();
      ticketText.textContent = '“' + quote.text + '”';
      ticketAuthor.textContent = quote.author;
      ticketNumber.textContent = 'No. ' + String(Math.floor(Math.random() * 9999)).padStart(4, '0');
      ticket.classList.add('visible');
    }, 180);
  }

  pullBtn.addEventListener('click', dispenseTicket);

  themeToggle.addEventListener('click', () => {
    const root = document.documentElement;
    const current = root.getAttribute('data-theme');
    if (current === 'dark') {
      root.setAttribute('data-theme', 'light');
    } else if (current === 'light') {
      root.removeAttribute('data-theme');
    } else {
      root.setAttribute('data-theme', 'dark');
    }
  });
</script>

</body>
</html>
